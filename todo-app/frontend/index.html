<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tasko — Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --accent: #c8f135;
      --accent-dim: #a8d120;
      --text: #f0f0f0;
      --text-muted: #888;
      --border: #2e2e2e;
      --danger: #ff4f4f;
      --radius: 14px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 40px 20px; }
    .container { max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 48px; }
    .logo { font-family: 'Syne', sans-serif; font-size: 42px; font-weight: 800; letter-spacing: -2px; }
    .logo span { color: var(--accent); }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
    .stats { display: flex; gap: 16px; margin-bottom: 32px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; flex: 1; text-align: center; }
    .stat-number { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
    .add-form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 32px; }
    .add-form h2 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .form-group { margin-bottom: 12px; }
    input, textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 12px 16px; outline: none; transition: border-color 0.2s; resize: none; }
    input::placeholder, textarea::placeholder { color: var(--text-muted); }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { height: 80px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: var(--accent); color: #0f0f0f; width: 100%; justify-content: center; font-weight: 600; }
    .btn-primary:hover { background: var(--accent-dim); transform: translateY(-1px); }
    .filters { display: flex; gap: 8px; margin-bottom: 20px; }
    .filter-btn { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .filter-btn.active { background: var(--accent); color: #0f0f0f; border-color: var(--accent); font-weight: 600; }
    .todo-list { display: flex; flex-direction: column; gap: 12px; }
    .todo-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; align-items: flex-start; gap: 16px; transition: all 0.2s; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .todo-item.completed { opacity: 0.5; }
    .checkbox { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; margin-top: 2px; }
    .checkbox.checked { background: var(--accent); border-color: var(--accent); }
    .checkbox.checked::after { content: '✓'; color: #0f0f0f; font-size: 13px; font-weight: 700; }
    .todo-content { flex: 1; }
    .todo-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .todo-item.completed .todo-title { text-decoration: line-through; }
    .todo-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .todo-date { font-size: 11px; color: var(--text-muted); margin-top: 8px; opacity: 0.6; }
    .todo-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .action-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.2s; }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.delete:hover { border-color: var(--danger); color: var(--danger); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 100%; max-width: 480px; margin: 20px; }
    .modal h2 { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); flex: 1; justify-content: center; }
    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty h3 { font-family: 'Syne', sans-serif; font-size: 20px; margin-bottom: 8px; color: var(--text); }
    .toast { position: fixed; bottom: 30px; right: 30px; background: var(--accent); color: #0f0f0f; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 200; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .error-msg { background: rgba(255,79,79,0.1); border: 1px solid var(--danger); color: var(--danger); padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">Task<span>o</span></div>
    <p class="subtitle">A simple, clean to-do list application</p>
  </header>
  <div class="stats">
    <div class="stat"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-number" id="activeCount">0</div><div class="stat-label">Active</div></div>
    <div class="stat"><div class="stat-number" id="doneCount">0</div><div class="stat-label">Completed</div></div>
  </div>
  <div class="add-form">
    <h2>New Task</h2>
    <div class="error-msg" id="errorMsg"></div>
    <div class="form-group"><input type="text" id="titleInput" placeholder="What needs to be done?" /></div>
    <div class="form-group"><textarea id="descInput" placeholder="Add a description (optional)..."></textarea></div>
    <button class="btn btn-primary" onclick="addTodo()">+ Add Task</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
    <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
  </div>
  <div class="todo-list" id="todoList"></div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Edit Task</h2>
    <input type="hidden" id="editId" />
    <div class="form-group"><input type="text" id="editTitle" placeholder="Task title" /></div>
    <div class="form-group"><textarea id="editDesc" placeholder="Description (optional)..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()" style="flex:1">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_URL = 'http://localhost:5000';
  let todos = [];
  let currentFilter = 'all';

  async function fetchTodos() {
    try {
      const res = await fetch(`${API_URL}/api/todos`);
      const data = await res.json();
      if (data.success) { todos = data.data; renderTodos(); updateStats(); }
    } catch (err) {
      showError('Could not connect to server. Make sure the backend is running.');
    }
  }

  async function addTodo() {
    const title = document.getElementById('titleInput').value.trim();
    const description = document.getElementById('descInput').value.trim();
    if (!title) { showError('Please enter a task title.'); return; }
    try {
      const res = await fetch(`${API_URL}/api/todos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('titleInput').value = '';
        document.getElementById('descInput').value = '';
        hideError();
        showToast('Task added!');
        fetchTodos();
      }
    } catch (err) { showError('Failed to add task.'); }
  }

  async function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (!todo) return;
    try {
      const res = await fetch(`${API_URL}/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: todo.title, description: todo.description, completed: !todo.completed })
      });
      const data = await res.json();
      if (data.success) { showToast(data.data.completed ? 'Task completed!' : 'Task reopened!'); fetchTodos(); }
    } catch (err) { showError('Failed to update task.'); }
  }

  async function deleteTodo(id) {
    try {
      const res = await fetch(`${API_URL}/api/todos/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) { showToast('Task deleted!'); fetchTodos(); }
    } catch (err) { showError('Failed to delete task.'); }
  }

  function openEdit(todo) {
    document.getElementById('editId').value = todo.id;
    document.getElementById('editTitle').value = todo.title;
    document.getElementById('editDesc').value = todo.description || '';
    document.getElementById('editModal').classList.add('open');
  }

  function closeModal() { document.getElementById('editModal').classList.remove('open'); }

  async function saveEdit() {
    const id = document.getElementById('editId').value;
    const title = document.getElementById('editTitle').value.trim();
    const description = document.getElementById('editDesc').value.trim();
    const todo = todos.find(t => t.id == id);
    if (!title) return;
    try {
      const res = await fetch(`${API_URL}/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, completed: todo.completed })
      });
      const data = await res.json();
      if (data.success) { closeModal(); showToast('Task updated!'); fetchTodos(); }
    } catch (err) { showError('Failed to update task.'); }
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTodos();
  }

  function renderTodos() {
    const list = document.getElementById('todoList');
    let filtered = todos;
    if (currentFilter === 'active') filtered = todos.filter(t => !t.completed);
    if (currentFilter === 'completed') filtered = todos.filter(t => t.completed);
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><h3>No tasks yet</h3><p>Add your first task above!</p></div>`;
      return;
    }
    list.innerHTML = filtered.map(todo => `
      <div class="todo-item ${todo.completed ? 'completed' : ''}">
        <div class="checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodo(${todo.id})"></div>
        <div class="todo-content">
          <div class="todo-title">${escapeHtml(todo.title)}</div>
          ${todo.description ? `<div class="todo-desc">${escapeHtml(todo.description)}</div>` : ''}
          <div class="todo-date">${new Date(todo.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
        </div>
        <div class="todo-actions">
          <button class="action-btn" onclick='openEdit(${JSON.stringify(todo)})'>✏️</button>
          <button class="action-btn delete" onclick="deleteTodo(${todo.id})">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  function updateStats() {
    document.getElementById('totalCount').textContent = todos.length;
    document.getElementById('activeCount').textContent = todos.filter(t => !t.completed).length;
    document.getElementById('doneCount').textContent = todos.filter(t => t.completed).length;
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; }
  function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
  function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  document.getElementById('titleInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

  fetchTodos();
</script>
</body>
</html>
